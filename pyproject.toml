[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["libs/common", "services/ingestion", "services/incident", "services/triage_agent"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE"]
ignore = ["B008"]  # FastAPI dependency injection uses calls in defaults

[tool.ruff.lint.per-file-ignores]
"docs/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["triage_common", "ingestion_service", "incident_service", "triage_agent", "conftest"]
